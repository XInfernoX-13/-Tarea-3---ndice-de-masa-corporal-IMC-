<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Calculadora de Índice de Masa Corporal (IMC)</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Introduce tus datos</h2>
            <form id="imcForm">
                <div class="campo">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" name="peso" required min="30" max="300" step="0.1">
                </div>

                <div class="campo">
                    <label for="altura">Altura (m):</label>
                    <input type="number" id="altura" name="altura" required min="1" max="2.5" step="0.01">
                </div>

                <button type="submit">Calcular IMC</button>
            </form>
        </section>

        <section id="resultado" class="resultado-section">
            <h2>Resultado</h2>
            <p id="valorImc">Tu IMC aparecerá aquí.</p>
            <p id="clasificacion"></p>
        </section>
    </main>

    <footer>
        <p>Autor: Juanjo</p>
    </footer>

    <script src="imc.js"></script>
</body>
</html>
